; Lilka Music Player (ESP32-S3)
; Build/flash: pioarduino (VSCode pioarduino IDE, or any PlatformIO with this platform URL).

[platformio]
default_envs = v2

[env:v2]
; pioarduino platform: arduino-esp32 3.3.12 + ESP-IDF 5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = lilka_v2
framework = arduino
lib_deps =
	; latest release supports arduino-esp32 3.x
	moononournation/GFX Library for Arduino
	; same U8g2 fork the Lilka SDK uses — its cyrillic fonts, rendered into a
	; 1bpp buffer and blitted onto our canvas (src/font.cpp)
	olikraus/U8g2 @ 2.35.9
	https://github.com/schreibfaul1/ESP32-audioI2S.git#4.0.0
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-Wno-pmf-conversions
monitor_speed = 115200
