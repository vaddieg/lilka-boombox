; Lilka Music Player (ESP32-S3)
; Build/flash: pioarduino (VSCode pioarduino IDE, or any PlatformIO with this platform URL).

[platformio]
default_envs = v2

[env:v2]
; pioarduino platform: arduino-esp32 3.3.12 + ESP-IDF 5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = lilka_v2
framework = arduino
lib_deps =
	; latest release supports arduino-esp32 3.x
	moononournation/GFX Library for Arduino
	; same U8g2 fork the Lilka SDK uses — its cyrillic fonts, rendered into a
	; 1bpp buffer and blitted onto our canvas (src/font.cpp)
	olikraus/U8g2 @ 2.35.9
	https://github.com/schreibfaul1/ESP32-audioI2S.git#4.0.0
	; AirPlay 2 receiver — vendored local libs (LDF chain mode needs explicit refs):
	; lib/airplay-esp32 (rbouteiller/airplay-esp32), lib/ext/* (Espressif registry)
	airplay-esp32
	esp_audio_codec
	; (libsodium + http_server + mdns come from the prebuilt core libs.)
	; LVGL/esp_lvgl_port/display driver removed — AirPlay mode has no display
	; (v1); the screen keeps the static Arduino-drawn status page. Re-add
	; from the airplay-esp32 upstream if the display work ever resumes.
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-Wno-pmf-conversions
	; vendored airplay-esp32 headers (upstream is a flat main/ include world)
	-Ilib/airplay-esp32/src/rtsp
	-Ilib/airplay-esp32/src/hap
	-Ilib/airplay-esp32/src/plist
	-Ilib/airplay-esp32/src/audio
	-Ilib/airplay-esp32/src/network
	-Ilib/airplay-esp32/src/dac
	-Ilib/airplay-esp32/src/dac_inc
	-Ilib/airplay-esp32/src/board_utils
	-Ilib/airplay-esp32/src/buttons
	-Ilib/airplay-esp32/src
	; The LDF puts vendored-lib objects BEFORE src/*.o on the link line — the
	; single-pass linker drops them before it sees our references. --start-group
	; forces the linker to re-scan until all symbols resolve.
	-Wl,--start-group
	; prebuilt esp_audio_codec decoders (build.lib in library.json is for lib
	; NAMES, not file paths — link the archive directly)
	-Llib/esp_audio_codec/lib
	-Wl,--whole-archive -lesp_audio_codec -Wl,--no-whole-archive
	; esp_audio_codec needs several include roots (upstream CMake COMPONENT_INCLUDE)
	-Ilib/esp_audio_codec/include/decoder
	-Ilib/esp_audio_codec/include/decoder/impl
	-Ilib/esp_audio_codec/include/encoder
	-Ilib/esp_audio_codec/include/encoder/impl
	-Ilib/esp_audio_codec/include/simple_dec
	-Wl,--end-group
monitor_speed = 115200
